<!--
════════════════════════════════════════════════════════════════════════════
OPERATING GUIDELINES — read this before running a daily/weekly update.
This is the single reference for "what are we looking for and why." Prior
sessions left the reasoning scattered across dated NOTE comments below (still
worth reading for precedent/examples) — this block is the standing rule set
those notes were applying. If you edit the rules below, edit the rule, not
just that day's note.

PURPOSE & AUDIENCE
This dashboard briefs C-suite / executive readers at organizations exposed to
international student mobility (universities, ed-tech, pathway/recruitment
companies, investors). The bar for inclusion anywhere in this file is: "would
this change what an executive does this week, or what they budget/staff for
this quarter?" Background context that a specialist would already know is not
news; a policy, funding, enrollment, or competitive shift that changes a
decision is.

TABS & WHAT EACH ONE IS FOR
- Intelligence Feed (NEWS array): the core 7-day rolling feed. Every item
  needs cat/impact/region/trend/tier/source/url and an executive "insight" +
  "action" — not just a summary. This is analysis-for-decisions, not a
  clipping service.
- Company Watch (CO_STATUS / market signals): financial health and stock/
  enrollment signals for tracked companies, PLUS company-specific news —
  leadership hires/departures, layoffs, M&A, and anything else specific to a
  named company — each with its own asOf date. See Daily Update Checklist.
- Tenders & Deadlines (TENDERS + WATCHLIST): open procurement opportunities in
  recruitment, marketing, and admissions services ONLY — not general IT,
  facilities, or academic-staff recruitment — followed by the regulatory/
  publication deadlines worth tracking (WATCHLIST, which ages out as dates pass).
  See Zero Fabrication Policy below; the tender list has previously contained
  fabricated/stale data and needs the most scrutiny. NOTE: the static conference
  calendar (old EVENTS array) and the static "Key Reports & Data" and India IBC
  tracker were removed by design — anything kept here must roll with the 7-day
  window or be a live, dated deadline, not a fixed reference list.
- India (isIndia lens): auto-filtered India-relevant NEWS + india-flagged SIGNALS
  tiles + a "new since last briefing" lead. Fully derived from rolling data — no
  standalone static array to maintain.
- People Moves / Reports Published: CXO-level moves and major report drops,
  also 7-day rolling like NEWS.

CATEGORY TAXONOMY (CAT)
policy (Policy & Visa), admissions, studyabroad, scholarships, rankings,
workrights (Post-Study Work), tuition, testing (Language Testing),
partnerships, tech, innovation. Use the closest fit — don't invent new
categories without adding them to the CAT dict.

IMPACT LEVELS (high / med / low)
high = changes a visa/enrollment/revenue outcome for a whole country or
segment (e.g. a visa rule with a hard effective date, a fee change that
shifts destination choice). med = meaningful for a specific institution type,
region, or channel but not sector-wide. low = worth logging for pattern-
tracking but wouldn't on its own change a reader's plan this week. When in
doubt, impact should track the "would this change what an exec does" bar
above, not how much press coverage a story got.

TIME WINDOWS
- NEWS, People Moves, Reports Published: 7-day rolling — kept at 7 days
  deliberately, not just as a display limit: it's the comparison window for
  seeing how a story is evolving day to day (e.g. a policy story that gets a
  new development 3 days later should still be visible next to the original).
  Purge items once they age out, every run — don't just stop adding, actively
  remove. (A FLOOR filter now enforces this at render time too: any story older
  than TODAY_LABEL − 7 days is auto-hidden from every view and count even if not
  purged — a safety net, not a substitute. Still purge the NEWS array each run so
  it doesn't grow unbounded; FLOOR just guarantees nothing stale can ever
  display. See the FLOOR const near TODAY_LABEL.) NOTE ON LINKS: every NEWS item
  carries a stable `id` slug (e.g. id:'opt-100k'), and ALL click-throughs
  (jumpToStory, Executive Priorities, Top Stories, India tab) target that id —
  never the array position. So you can reorder or purge the NEWS array freely
  without recomputing any indices or touching the Exec-Priorities links; just
  keep each new story's id unique and reference it by slug. This replaced the
  old array-index scheme that silently broke links on every reshuffle. ANCHOR THE WINDOW EXPLICITLY EVERY RUN, not as a vague "last 7
  days": state the actual floor date in the run's audit note (e.g. "today is
  Jul 26 → floor is Jul 19, remove anything dated before that") so there's no
  ambiguity about inclusive/exclusive boundaries or which timezone's "today"
  applies. Use the person's stated reference day/timezone if given (e.g.
  IST); otherwise any single consistent timezone is fine as long as it's
  named in the note.
- Market State Signals: THIS IS NOT A FIXED SET OF NAMED TOPICS. Earlier
  versions of this guideline (and the dashboard itself) treated the 7 tiles
  as permanent slots — US Enrollment, Policy Climate, Scholarship Funding,
  Canada Permits, UK Grad Route, TOEFL, Alt Destinations — each needing its
  own independent real-world update to stay fresh. That model is wrong and
  was corrected Jul 25, 2026 (see NOTE below): some topics (TOEFL's test
  format, a "6/7 nations" policy count) simply don't get new reporting every
  week — there is nothing to find, no matter how hard you search — so a
  fixed slot for them either sits stale indefinitely or gets propped up with
  a tangential citation just to bump the date, which is fabricating
  freshness, not reporting it.
  The correct model: every run, populate the 7 tiles FROM whatever is
  actually in the last 7 days of the NEWS feed — pull the standout
  quantifiable stat out of that week's top stories (a %, a $, a date, a
  count), the same way Number of the Day already does for a single figure.
  A topic with fresh news this week gets a tile; a topic without fresh news
  drops out — it can come back the next time there's real news about it.
  This makes 7-day freshness automatic instead of something to chase: you
  are not verifying that TOEFL is still 85 minutes, you are asking "what are
  the 7 most decision-relevant numbers to come out of this week's stories,"
  which is a different and answerable question every single run.
  STALE_DAYS (currently 7) still exists as a safety net for a tile that
  didn't get rotated out when it should have been — not as a target to
  defend by searching harder for a fixed topic.
- Tenders: no fixed window — an item stays listed only as long as it is
  verified still open (see Zero Fabrication Policy). Check known open items
  every run; don't assume a deadline still holds without re-fetching.
- Disruption Alert: not time-windowed at all — set active:true ONLY for a
  genuine market-breaking event, not routine policy news. If nothing
  qualifies, leave it inactive; don't manufacture urgency to fill the tile.
  MUST BE ACTIVELY RE-EVALUATED EVERY RUN, not just left running once set —
  it was found on Jul 27, 2026 sitting untouched with no asOf field at all,
  the same "checked once, then ignored for a week" failure pattern already
  caught on Market State Signals. Every run: (1) confirm the underlying
  event is still the single most disruptive live item — if something newer
  and bigger has broken, swap it in; (2) if the original disruption has
  fully transitioned to "known, being managed" (already covered in NEWS/
  Signals/Number of the Day for many days with no new development), retire
  it — active:false — rather than let a week-old event keep occupying the
  one banner reserved for something urgent; (3) if it's kept active because
  it's still genuinely the top disruption, recompute any time-relative
  language in verdict (e.g. "roughly N weeks") against today's actual date,
  and update the asOf field.

DAILY UPDATE CHECKLIST — what "run the daily update" means per component
- Signal bar / Market State Signals: re-derive from today's actual news, not
  carried forward by default. For each of the 7 signals, ask "did anything in
  today's search touch this metric?" If yes, update value/sub/asOf and note
  the source in the audit trail. If genuinely nothing moved it, leave the
  asOf date as-is (don't fake a refresh) but still record in the NOTE that it
  was checked.
- Why Today Matters: regenerate this section's synthesis each run from that
  day's actual top story or stories — it should read differently on a day
  with a major policy shift than on a quiet day. Don't let it go stale while
  the feed below it moves. IMPORTANT TECHNICAL NOTE: this section (and
  Executive Priorities, and Number of the Day) is hardcoded prose in
  renderOverview() — it does NOT recompute automatically the way Top Stories
  does (that one correctly re-derives from DELTA_BRIEFING every render). If
  you only edit the NEWS array and don't separately rewrite this prose, it
  will silently go stale even while the rest of the dashboard looks current
  — this exact gap was caught and fixed on Jul 25, 2026 (see NOTE below).
  Rewriting it is a manual step every run, not optional. ALSO CHECK: the
  Why Today Matters HEADER LABEL carries its own hardcoded date (separate
  from the body text below it) — updating the prose without updating this
  label leaves a stale date sitting right next to fresh-looking content,
  which reads as worse than not updating at all. Grep for "why-today-label"
  and confirm the date matches today's cutoff every run.
- DELTA_BRIEFING SEQUENCING (caught Jul 27, 2026 — a real bug, not just a
  display glitch): DELTA_BRIEFING must NOT be advanced to today's date in
  the same run that adds a story dated today — the "new since last
  briefing" filter is strictly date > DELTA_BRIEFING, so a same-day story
  compared against a same-day cutoff fails the check and silently falls
  back to "Nothing new," even though the reader seeing this file right now
  has never seen that story. Advance DELTA_BRIEFING to reflect what the
  reader has ALREADY been shown in a PRIOR delivery — i.e. only move it
  forward to cover a story once that story has already appeared as "new"
  in a run the person has seen, never in the same run you add it.
- Top stories / "Nothing new": most days will only produce one or two
  genuinely new stories — that's expected, not a shortfall. Lead with those;
  if a run truly finds nothing new (as documented in some prior daily-run
  notes), say so explicitly rather than padding the section.
- Executive Priorities: derive directly from today's top story/stories, not
  a static list — priorities should shift as the story mix shifts.
- Number of the Day: pull from whatever stat is most decision-relevant in
  today's actual updates, not a recycled figure from a previous run.
- Industry Trends / Company Watch: two distinct things to check each run —
  (1) sector-wide developments (funding shifts, enrollment trends, M&A
  climate) and (2) company-specific news for tracked companies, explicitly
  including leadership/hiring/firing moves, not just financial results.
  A company with no news is not the same as a company that hasn't been
  checked — say which in the audit note.
  SNAPSHOT (Industry Snapshot tiles) follows the SAME rotating-tile model as
  Market State Signals above, not a fixed set of named slots — corrected
  Jul 27, 2026 after a prior version hardcoded three permanent keys
  (idp/distress/ma), which is exactly the anti-pattern this file already
  warns against for Signals: "Industry Distress: 0" and "M&A Activity: 0"
  sat there indefinitely because the slot existed regardless of whether
  there was anything real to report. SNAPSHOT is now an array; only add a
  tile when a real, dated, verified fact backs it (a stock move, a
  workforce change, a funding round, a genuine distress or M&A signal) —
  a quiet week means fewer tiles, not padded ones. Don't recreate a fixed
  "distress" or "M&A" slot just to have three tiles.
- Tenders: search for newly declared RFPs/tenders (see Tender Search Scope &
  Cadence and the Zero Fabrication Policy) — this is a discovery task each
  run, not just a re-check of already-listed items.
- Events: lower-maintenance by design — check for schedule changes or newly
  announced conferences, but no daily re-derivation needed the way the
  sections above require.

ZERO FABRICATION POLICY (referenced throughout the NOTE comments below —
this is the rule those notes are enforcing)
1. Never add a tender, deadline, dollar/currency figure, or "confirmed" fact
   without independently verifying it against a live, direct-fetched source.
   A user-supplied claim, a search snippet, or an aggregator's framing is a
   lead, not a source — fetch the primary notice/page yourself.
2. If the live page can't be fetched or rendered (e.g. JS-only pages that
   return no usable content), the item is UNCONFIRMED and stays out — do not
   fill the gap with a plausible-sounding value.
3. Never carry a figure or deadline forward from a previous run without
   re-checking it if the run touches that item — dashboards have previously
   shown fabricated or stale deadlines (see Jul 23 audit notes below) that
   only direct re-fetching caught.
4. If a source is closed, awarded, or superseded, remove it — don't leave
   stale "open" opportunities in the feed.
5. When you can't verify something, say so in the audit trail (see below)
   rather than silently omitting it — the reasoning is part of the record.

TENDER SEARCH SCOPE & CADENCE
See the TENDER-ROTATION-CURSOR comment block further down for the live tier
list and rotation cursor. Summary: Tier 1 countries are searched every run;
Tier 2 and Tier 3 are large country lists split into rotating sub-groups so
the full list gets covered over several runs without repeating the same
search every day. Advance the cursor every run regardless of whether
anything qualified — a null result is still progress through the rotation.

SEARCH CADENCE PROTOCOL (added Aug 2, 2026 — the fix for "67 sources, still missing news")
The failure mode this replaces: scanning all ~67 sources uniformly every run. That gives
a source publishing several times a day (PIE, ICEF) the same single glance as one that
publishes once a year (HESA), so the fast sources get under-read and the slow ones burn
the budget re-confirming "nothing new." Tier by publish-cadence x strategic weight instead.
India sources are Tier A regardless of raw cadence because they are load-bearing for who the
client actually is. Rotating a source OUT for the week/month is not the same as dropping it —
it means it isn't due this run; Tier A + whichever B/C group the cursor points at is the run's
actual scan set.

TIER A — every single run, no rotation:
  USCIS, IRCC (Canada), The PIE News, ICEF Monitor,
  + India: UGC notifications, AICTE, Times of India Education, Careers360, Shiksha,
    Hindustan Times Education.
TIER B — weekly; 3 rotating groups, one per week, ~3-week full cycle:
  B1: Times Higher Ed, Inside Higher Ed, GOV.UK/UKVI (UK Home Office), Business Standard Education
  B2: University World News, Higher Ed Dive, Home Affairs (AU), The Hindu Education
  B3: Chronicle of HE, StudyTravel Network, US State Dept, Reuters/Bloomberg/FT Education
TIER C — monthly; 3 rotating groups, one per month, ~3-month full cycle:
  C1: HESA, NCES/IPEDS, Statistics Canada
  C2: OECD Education at a Glance, UNESCO Stats, IIE Open Doors data
  C3: Big-4/MBB advisory (McKinsey, EY-Parthenon, BCG, Bain, KPMG, L.E.K., Strategy&),
      HolonIQ, WES/WENR, ranking bodies (QS, Shanghai, US News), sector associations
      (NAFSA, ACE, AACSB, NACAC, AACRAO, EAIE, UUKi, Universities Australia/Canada, HEPI)
EVENT-TRIGGERED — outside rotation entirely, checked when the calendar date is near
  regardless of whose turn it is: national budget days, known ranking-release dates,
  IIE Open Doors annual (Nov), HESA annual release, major intake-window starts.
LIVE ROTATION CURSOR — advance EVERY run; a null result still counts as progress through
  the rotation (same discipline as the tender cursor). Update this line each run:
  >>> Week of Aug 2, 2026 → Tier B group: B1 · Tier C group: C1 <<<
  Next weekly run → B2, then B3, then back to B1. Next monthly turn → C2, then C3, then C1.

AUDIT TRAIL CONVENTION
Every run should leave a dated // NOTE (<date>, <what>): ... comment (see
examples below) stating what was searched, what was added/removed and why,
and what was checked but rejected and why — especially rejections under the
Zero Fabrication Policy. Future sessions rely on these notes as precedent;
write them for that reader, not just as a changelog.

const NEWS=[
  {date:'Jul 28, 2026',published:'Jul 9, 2026',cat:'admissions',impact:'high',region:'US',trend:'down',tier:'T1',source:'IIE / ICEF Monitor / Inside Higher Ed / Forbes',url:'https://monitor.icef.com/2026/07/decline-in-indian-demand-a-major-factor-in-softer-outlook-for-foreign-enrolment-in-us-higher-education-in-2026-27/',id:'iie-snapshot',title:'IIE Spring 2026 Snapshot: 59% of US Colleges Report Falling International Applications, India the Biggest Driver',summary:'IIE\'s twice-yearly Spring 2026 Snapshot (585 responding US institutions, hosting ~48% of all international students in the US, surveyed 5 May–11 June, released ~9 Jul) found 59% report a decline in international application volumes for 2026/27, with 63% expecting an overall enrollment decrease and nearly 1 in 4 expecting a "substantial decline." India is the standout driver: only 39% of institutions reported stable/increased applications from India specifically (per ICEF), and a separate IIE figure cited by The PIE put the India-specific application decline at 61% of institutions. 92% of those anticipating drops cited visa denials/delays; 80% cited US travel restrictions; 77% cited students choosing other destinations. On the positive side, 84% of institutions still call international recruitment a priority and most are holding or increasing recruitment budgets. Independently corroborated across ICEF Monitor, Forbes, and Inside Higher Ed, each citing the same underlying IIE report.',insight:'This is the clearest, most directly quantified evidence yet that the India-outbound slowdown specifically (not just a generic Big-Four decline) is the dominant driver of the 2026/27 US outlook — precisely the corridor this consultancy tracks. The 92%/80%/77% reasons ranking (visa friction > travel restrictions > destination-switching) gives a concrete order of priority for where counselling and positioning effort should go.',action:'Use the India-specific 61%/39% figures directly in client-facing India-outbound positioning for the US — and pair the "84% still prioritising recruitment, budgets holding" finding with proof points (documentation support, alternative-destination guidance) that address the top three cited barriers.',industry:['First-order: US-bound India pipelines should expect materially softer 2026/27 application volumes industry-wide, not an agency-specific issue.','Second-order: institutions holding recruitment budgets steady despite the decline signals continued willingness to pay for agencies/platforms that can still deliver qualified, visa-ready applicants.']},
  {date:'Jul 28, 2026',published:'Jul 24, 2026',cat:'workrights',impact:'high',region:'CAN',trend:'down',tier:'T1',source:'LiveWire Calgary / CTV News / VisaVerge',url:'https://www.visaverge.com/f1visa/calgary-international-students-stage-hunger-strike-over-denied-pgwp-by-ircc/',id:'calgary-pgwp',title:'Calgary PGWP Refusals Escalate to Hunger Strike, ~1,500 Graduates Affected, Federal Court Cases Filed',summary:'The Calgary PGWP-refusal story (previously covered, then dropped from this feed on Jul 25 as it aged past the 7-day floor) has materially escalated: a group of affected international students began a hunger strike on 24 July 2026 over Post-Graduation Work Permit refusals. IRCC updated its PGWP eligibility webpage on 24 June 2026 to state that non-credit programmes do not qualify — which it describes as a clarification, not a new rule — but this is now being applied to roughly 1,500 graduates (up from the "hundreds" first reported in mid-July), many from a public-private college partnership in Alberta (Portage College / Canadian Institute of Osteopathic Therapy) and a large share from India, who enrolled in 2024 believing their non-credit programmes qualified. At least one graduate (Jaspinder Kaur, from Punjab) has filed for federal judicial review. Confirmed across LiveWire Calgary, CTV News, VisaVerge, and immigcanada.com, all independently corroborating the 24 June webpage-update date, the ~1,500 figure, and the 24 Jul hunger-strike start.',insight:'This converts what looked like a contained, page-13 compliance story into a live reputational and legal flashpoint for Canada\'s international-education brand — retroactive application of a webpage "clarification" to students who enrolled years earlier, disproportionately affecting Indian students, is exactly the kind of story that erodes trust in a destination\'s process integrity, distinct from the headline policy caps.',action:'Flag to any clients with non-credit/college-partnership pathways into Canada that PGWP eligibility for non-degree programmes is now being enforced retroactively — steer prospective applicants firmly toward degree/diploma/certificate programmes at public DLIs and away from non-credit partnership programmes until this is resolved.',industry:['First-order: agencies/institutions with non-credit-programme Canada pipelines face a sudden credibility and liability exposure with affected students.','Second-order: broader reputational drag on Canada as a study destination among Indian applicants specifically, compounding the existing SDS-closure and cap narrative.']},
  {date:'Jul 28, 2026',published:'Jul 1, 2026',cat:'tuition',impact:'high',region:'AUS',trend:'down',tier:'T1',source:'ICEF Monitor',url:'https://monitor.icef.com/2026/07/surprise-hike-in-international-student-visa-application-fees-a-direct-hit-to-australias-competitiveness/',id:'aus-visa-fee',title:'Australia Hikes Student & Graduate Visa Fees ~25% With No Warning, Effective Jul 1',summary:'Australia\'s Department of Home Affairs raised international student and graduate-visa application fees effective immediately from 1 July 2026, with no prior consultation with the sector. The student visa fee (subclass 500, higher-ed/VET) rose from AU$2,000 to AU$2,500 (AU$2,050 for ASEAN nationals); the ELICOS student visa fee rose from AU$2,000 to AU$2,050; and the Temporary Graduate visa (485, post-study work) rose from AU$4,600 to AU$5,750. Comparing 2022 to 2026 fees, the student visa fee is up +285% and the graduate visa fee up +148%; year-on-year alone, both rose +25% in the past twelve months. This story was previously in this feed (as a Jul 19 entry) but was removed on the Jul 27 run as it aged past the 7-day floor, without a replacement item — re-added now as a genuine, verified coverage gap, not new news.',insight:'A +25% jump in the very fee that gates entry, landing with zero consultation, is a direct and immediate affordability hit on top of Australia\'s existing "managed growth" caps — ICEF\'s own framing calls it "a direct hit to Australia\'s competitiveness." Update (confirmed 26 Jul): the government has now explicitly confirmed the ASEAN rate is a deliberate diplomatic exemption, not an oversight — Assistant Minister Julian Hill said it reflects Australia deepening regional ties with Southeast Asia. That means India, Pakistan, and Bangladesh pay the full new AU$2,500/AU$5,750 fees while ASEAN applicants pay only a CPI-linked AU$2,050 — a real, government-confirmed cost differential between South and Southeast Asian applicants, not just a rounding artifact.',action:'Rebuild Australia-bound cost estimates to the new AU$2,500/AU$2,050/AU$5,750 fee figures immediately — this is a hard, already-effective cost change, not a future deadline like France\'s Aug 1 threshold. For India/Pakistan/Bangladesh-focused pipelines specifically, factor in the confirmed, durable cost gap versus ASEAN applicants when comparing Australia to other destinations.',industry:['First-order: every current and future Australia-bound applicant now pays materially more just to lodge a visa application, regardless of institution or agency.','Second-order: reinforces the "alternative/Europe destinations gaining share from Big-Four tightening" theme already tracked in this feed — Australia joins the US, UK, and Canada in raising cost/friction in the same window.']},
  {date:'Jul 29, 2026',cat:'admissions',impact:'med',region:'US',trend:'down',tier:'T2',source:'The PIE News / EnglishUSA-BONARD',url:'https://thepienews.com/us-elt-hit-by-14-student-drop-and-shorter-stays/',id:'us-elt',title:'US English Language Teaching Sector Hit by 14% Student Drop, Shorter Stays',summary:'EnglishUSA and BONARD\'s new annual report (227 providers surveyed) found US English Language Teaching (ELT) student numbers fell 14% in 2025, with a near-20% drop in total student-weeks as students also stayed for shorter periods. EnglishUSA executive director Cheryl Delk-Le Good told The PIE the shorter stays compound the headline decline\'s impact on tuition revenue, staffing, and provider sustainability. Reported economic contribution from participating programmes fell to an estimated $870M, down from $950M in 2024. Experts cited domestic policy developments and visa barriers over the past two years as drivers and warned the decline could worsen in 2026.',insight:'ELT is usually the first rung on the US pathway ladder (language study → degree programme), so a 14% volume drop with even-steeper student-week erosion is a leading indicator for degree-level US enrollment pressure a year or two out, on top of the direct-application decline IIE\'s Spring Snapshot already documented.',action:'Treat US ELT/pathway partners as an early-warning signal, not just a standalone segment — a shrinking ELT pipeline today likely means fewer bachelor\'s/master\'s applicants from the same source markets in 2027/28.',industry:['First-order: US-based ELT providers and pathway partners face direct revenue and staffing pressure now.','Second-order: leading-indicator read-through to degree-level US enrollment pipelines 12–24 months out.']},
  {date:'Jul 29, 2026',published:'Jun 25, 2026',cat:'partnerships',impact:'med',region:'Europe',trend:'down',tier:'T1',source:'The Irish Times / Irish Examiner / ICOS',url:'https://www.irishtimes.com/ireland/education/2026/06/25/foreign-language-students-in-limerick-left-in-dark-over-schools-future/',id:'limerick-closure',title:'Limerick English School\'s Abrupt Closure Leaves 250+ International Students in Limbo',summary:'Student Campus, an English-language school on Patrick Street in Limerick, closed abruptly without notice in June 2026. More than 250 enrolled students (including from Brazil and Chile) and 300+ who had already paid fees but not yet arrived were left without classes, with over 30 staff reportedly unpaid since April. The Irish Council for International Students (ICOS) says it has been contacted by hundreds of affected students and by the Chilean Embassy on behalf of its citizens; students need continuous enrollment to keep lawful immigration status in Ireland. As of late July, the Department of Justice says only that it is "monitoring the situation," with no resolution announced.',insight:'This lands awkwardly for Ireland just as this feed has separately tracked Ireland as a rising Big-Four alternative (record 2024/25 enrollments, Indian enrollments up nearly 30%, and a new International Education Mark quality-assurance push) — an unresolved provider-failure story with immigration-status stakes for students is exactly the kind of reputational risk that undercuts a "safe alternative destination" pitch if it drags on unresolved.',action:'If advising clients toward Irish ELT pathways, flag provider financial-stability diligence explicitly until Ireland\'s new International Education Mark quality-assurance regime is actually in force — this is precisely the gap it\'s meant to close.',industry:['First-order: affected students face immigration-status risk and financial loss with no clear government resolution over a month later.','Second-order: a live test of Ireland\'s regulatory response time on provider failure, right as it positions itself as a more trustworthy Big-Four alternative.']},
  {date:'Jul 29, 2026',cat:'policy',impact:'high',region:'CAN',trend:'down',tier:'T1',source:'IRCC data / Barbican Immigration / ImmigCanada',url:'https://www.barbicanimmigration.ca/post/canada-sees-a-steep-decline-in-new-temporary-resident-arrivals',id:'canada-arrivals',title:'Canada: New Temporary Resident Arrivals Down ~70% Jan–May 2026 vs. 2024; New Study Permits Down ~83%',summary:'Newly released IRCC data shows new temporary resident arrivals to Canada fell nearly 70% between January and May 2026 versus the same period in 2024 — about 225,000 fewer arrivals. New study-permit arrivals specifically fell almost 83%; new temporary work-permit arrivals fell over 62%. This is arrivals data (new entrants), distinct from and more severe than the already-tracked 408,000 total-permits-to-be-issued figure — the government continues to frame this as progress toward its target of cutting temporary residents below 5% of the national population by end of 2027. Confirmed across two independent sources citing the same IRCC release.',insight:'An 83% collapse in new study-permit arrivals is a materially sharper decline than the aggregate 408K/−7% figure already in this feed suggests — that number describes planned 2026 issuances, this one describes what\'s actually happened on the ground Jan–May. Together they show the cap is landing harder and faster than the annual figure alone implies.',action:'Recalibrate any Canada-bound volume forecasts to the arrivals data, not just the annual permit-issuance target — the in-year trajectory is running well below even the already-reduced 2026 plan.',industry:['First-order: agencies/institutions with active Canada pipelines should expect enrollment realities well below the headline 408K annual figure.','Second-order: reinforces the diversification narrative already building in this feed (Ireland, Italy, New Zealand) as Canada volume craters faster than planned.']},
  {date:'Jul 29, 2026',cat:'studyabroad',impact:'med',region:'Asia',trend:'up',tier:'T2',source:'The PIE News / Education New Zealand',url:'https://thepienews.com/not-an-australia-alternative-new-zealands-international-ed-sector-is-going-for-growth/',id:'nz-growth',title:'New Zealand Pitches Itself as a Destination in Its Own Right, Not an Australia Alternative',summary:'Speaking at The PIE Live Asia Pacific 2026 (Gold Coast, Jul 28–29), New Zealand sector leaders framed the country\'s growth strategy around a distinct offer — smaller scale, stronger community integration, high public support — rather than positioning as a fallback when Australia tightens. This follows ENZ\'s confirmed 2025 full-year data: 92,580 international enrollments, +11% year-on-year and 80% of pre-COVID peak, with strong growth from newer markets Sri Lanka and Nepal. At the same event, Australia\'s assistant minister for international education Julian Hill separately warned that 60–70% student concentration from one source country is bad for "student experience, social licence, soft power and business risk" — a live signal of Australia\'s own concentration-risk thinking alongside its Jul 1 fee hike and 2027 NOSC allocations already tracked here.',insight:'New Zealand explicitly rejecting the "Australia alternative" framing is a positioning signal worth tracking on its own terms — if it succeeds, it becomes a genuine fourth/fifth-choice destination competing on its own value proposition (community integration, diversification into Sri Lanka/Nepal) rather than simply absorbing Big-Four overflow.',action:'Treat New Zealand as a distinct-value-proposition market in client positioning, not a generic "Australia is full, try NZ" pivot — its own growth narrative (smaller scale, integration, diversification) is the actual sell.',industry:['First-order: NZ-focused recruitment should lean into community/outcomes messaging rather than Big-Four-overflow framing.','Second-order: Australia\'s own public commentary on concentration risk suggests further policy moves favoring source-market diversification are likely, not a one-off.']},
  {date:'Jul 29, 2026',published:'Jul 6, 2026',cat:'tuition',impact:'high',region:'UK',trend:'down',tier:'T1',source:'Office for Students / Russell Group / MillionPlus',url:'https://www.officeforstudents.org.uk/news-blog-and-events/press-and-media/the-office-for-students-receives-funding-guidance-for-2026-27/',id:'uk-spg',title:'UK Strategic Priorities Grant Cut a Further £50.9M for 2026-27 — Second Consecutive Year of Cuts',summary:'The Office for Students confirmed on 6 July that the Strategic Priorities Grant (SPG) — England\'s main direct teaching-funding stream for universities — falls to £1.252bn for 2026-27, a £50.9m reduction versus 2025-26, on top of a £100m cut the year before (19% real-terms reduction over two years). Capital funding also drops slightly (£88m from £92m); HEIF research-collaboration funding is protected at £48m. Teaching-grant support is removed entirely for a range of subjects including nursing, computing, history, geography, archaeology, and creative/performing arts, alongside reduced student-premium funding for disadvantaged students. Russell Group and MillionPlus both issued critical responses; this compounds, and gives a harder number to, the "unstable hybrid future" warning already in this feed.',insight:'A second consecutive year of direct teaching-grant cuts, with nursing and computing losing dedicated support entirely, sharpens the financial-pressure case already building in this feed — institutions facing this alongside falling international fee income (their main offsetting revenue lever) have less room to absorb both hits at once.',action:'For UK-focused partnership or TNE conversations, expect providers hit hardest by the SPG cut (nursing/computing/creative-subject-heavy institutions) to be the most motivated counterparts for international-recruitment or franchise deals to offset the domestic funding loss.',industry:['First-order: universities delivering the affected subjects lose direct government support and must find alternative revenue, most plausibly international fees or partnerships.','Second-order: reinforces the “TNE/partnership expansion to offset domestic shortfalls” dynamic already flagged in this feed with a concrete, government-confirmed funding figure.']},
  {date:'Jul 29, 2026',published:'Jul 23, 2026',cat:'admissions',impact:'med',region:'UK',trend:'up',tier:'T2',source:'UCAS / British Council',url:'https://opportunities-insight.britishcouncil.org/short-articles/news/ucas-data-shows-71-growth-undergraduate-applicants',id:'uk-ucas',title:'UK: International UCAS Applications Hit Record High (+7.1%); India Grows Only Modestly, Pakistan Falls',summary:'UCAS\'s final June-deadline data for the 2026 entry cycle shows international undergraduate applications reached a record 148,350 — up 7.1% year-on-year, the fastest growth in over a decade, pushing international students\' share of all UCAS applicants higher (72% of applications now go to the most selective institutions, versus 41% from UK students). China drove much of the growth (+12.2%). India remained the #2 source market but grew only modestly (+1.4%) — still an improvement on the 11.3% decline India saw the year before — while Pakistani applicants fell. Note: several outlets (including Shiksha) reported different, inconsistent India figures (8,870 vs. 11,470 applicants) drawn from an earlier, partial January "equal consideration" deadline snapshot rather than this final June dataset — this entry uses the reconciled, final UCAS/British Council figures.',insight:'The UK remains structurally open and growing for international UG applicants overall, but India\'s own trajectory is one of stabilization after a sharp prior-year decline, not renewed strong growth — a materially different story from China\'s continued acceleration in the same dataset.',action:'Frame UK positioning to India-outbound clients around "recovering, not surging" — set expectations against China\'s +12.2% growth rather than assuming India is riding the same wave.',industry:['First-order: UK institutions should not expect Indian UG application growth to mirror China\'s pace this cycle.','Second-order: Pakistan\'s decline alongside India\'s modest growth suggests South Asian demand for the UK is uneven by market, not moving as a bloc.']},
  {date:'Jul 30, 2026',published:'Jul 9, 2026',cat:'partnerships',impact:'high',region:'Asia',trend:'up',tier:'T2',source:'The PIE News / Flinders University / Ministry of External Affairs (India)',url:'https://thepienews.com/flinders-university-announces-india-campus-as-modi-visits-australia/',id:'flinders-india',title:'Two Australian Universities Advance India Campuses: Flinders (Bengaluru) Gets Letter of Intent, Victoria University (Gurugram) Gets Full Approval',summary:'During PM Modi\'s official visit to Australia (8–10 Jul) for the third India-Australia Annual Summit, two concrete IBC/TNE outcomes were confirmed. Flinders University received a Letter of Intent from India\'s University Grants Commission to open a campus in Bengaluru, offering undergraduate/postgraduate business and technology programmes (including an MBA and Master of IT); first students expected early 2027, application details to follow. Victoria University went further, receiving a full Letter of Approval to set up and operate a campus in Gurugram (NCR) — a more advanced regulatory stage than Flinders\' LoI. IEAA chief executive Phil Honeywood noted that "with visa approvals so low, the only bright light of our bilateral education relationship is offshore delivery."',insight:'This is a direct, concrete template for the India-inbound IBC vertical this consultancy tracks: two different Australian universities at two different regulatory stages (LoI vs. full approval) in the same week, both explicitly framed by sector leaders as a hedge against collapsing outbound visa approvals. The Honeywood quote is the clearest articulation yet of the strategic logic driving Big-Four universities toward India campuses — not opportunistic expansion, but a direct response to tightening study-visa numbers.',action:'Track both campuses\' application-timeline announcements closely (Flinders\' "later this year" detail release, Victoria\'s Gurugram operational timeline) — these are live, near-term IBC opportunities to map against India\'s UGC/regulatory approval pipeline for other prospective foreign-university entrants.',industry:['First-order: Bengaluru and Gurugram gain concrete new Australian-university IBC options within the next 12–18 months, direct competition for existing India campus operators.','Second-order: explicit sector commentary linking IBC expansion to outbound-visa weakness suggests more Big-Four universities will pursue the same India-campus hedge — a trend to watch for additional entrants, not a one-off.']},
  {date:'Jul 31, 2026',cat:'workrights',impact:'high',region:'US',trend:'down',tier:'T1',source:'Forbes / SCMP / Benzinga / The PIE News',url:'https://www.forbes.com/sites/annaesakismith/2026/07/31/trump-weighs-100000-fee-for-international-graduates-to-work-in-the-us/',id:'opt-100k',title:'Trump Administration Weighs a $100,000 Fee on OPT Post-Study Work',summary:'Multiple outlets (Forbes, SCMP, Benzinga, NewsNation, The PIE) reported Jul 30–31 that the Trump administration is weighing a $100,000 fee on Optional Practical Training (OPT) — the programme that lets international graduates work in the US for one to three years after a degree. Roughly 419,000 graduates were on OPT in 2024. It is a proposal under discussion, NOT yet signed off or finalised. It mirrors the administration\'s earlier $100,000 H-1B fee, which was narrowed to new-from-abroad hires after industry pushback and partly blocked by a Boston federal appeals court. Update (3 Aug): DHS reiterated that "no policies should be considered final until formally announced" (Forbes/Stuart Anderson, 3 Aug) — a week on, still no implementing rule, fee schedule, or eligibility guidance has been published, so it remains a proposal, not a policy.',insight:'OPT is one of the single biggest reasons students choose the US and a core justification for high tuition — a $100k fee would functionally price most graduates out of post-study work and could be more damaging to US inbound demand than the Sept 15 duration-of-status rule already in force. Because it is still only a proposal, the near-term effect is uncertainty: expect it to surface immediately in competitor destinations\' pitches (Canada PR pathway, UK, Australia) even before any rule exists. India is the single most exposed market: Indians were ~48% of new STEM OPT authorisations in 2024 and roughly 97,600 Indians were on OPT that year — the largest single-country group by far (Open Doors 2024) — so the fee would land disproportionately on Indian STEM graduates.',action:'Add the $100k-OPT scenario to US-bound client risk conversations now as a downside case, and lean into post-study-work certainty elsewhere (Canada\'s new PR pathway, UK Graduate Route) in comparative positioning — but flag clearly that it is a proposal, not law, to avoid over-steering families on unconfirmed policy.',industry:['First-order: heightened uncertainty depresses US post-study-work appeal immediately, compounding the Sept 15 rule and the visa-denial-driven application decline already in this feed.','Second-order: destinations with clearer post-study-work routes (Canada, UK, Australia, Germany) gain a sharper comparative pitch — a tailwind for agencies with multi-destination portfolios.'],impacts:['Shorelight','INTO University'],thread:'US post-study-work squeeze',india:true},
];

let VIEW='overview';
const F={cat:'all',impact:'all',region:'all',trend:'all'};
let Q='';

function setView(v, btn){
  VIEW=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll(`[data-view="${v}"]`).forEach(el=>el.classList.add('active'));
  render();
}

function jumpToStory(idx){
  clearFilters();
  setView('news',document.querySelector(`[data-view="news"]`));
  setTimeout(()=>{
    const el=document.getElementById('story-'+idx);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('story-flash');setTimeout(()=>el.classList.remove('story-flash'),1600);}
  },60);
}

function sf(type,val,btn){
  document.querySelectorAll(`[data-f="${type}"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  F[type]=val;
  render();
}
function doSearch(v){Q=v;render();}

function tog(idx){
  const box=document.getElementById('ib'+idx);
  const btn=document.getElementById('tb'+idx);
  if(!box||!btn)return;
  const o=box.classList.toggle('hidden');
  btn.classList.toggle('open',!o);
}

function matchNews(n){
  return inWindow(n)&&(F.cat==='all'||n.cat===F.cat)&&(F.impact==='all'||n.impact===F.impact)&&(F.region==='all'||n.region===F.region)&&(F.trend==='all'||n.trend===F.trend)&&(!Q||(n.title+n.summary+n.source).toLowerCase().includes(Q.toLowerCase()));
}

function srcBadge(tier){
  if(tier==='T1')return'<span class="src-badge sb-gov">🟢 Official</span>';
  if(tier==='T2')return'<span class="src-badge sb-trade">🔵 Industry</span>';
  return'<span class="src-badge sb-media">🟡 Media</span>';
}

function renderNews(vis){
  if(!vis.length){
    const chips=[];
    if(F.cat!=='all')chips.push(`<span class="preset-btn" onclick="sf('cat','all',document.querySelector('[data-f=cat][data-v=all]'))">Reset Category</span>`);
    if(F.region!=='all')chips.push(`<span class="preset-btn" onclick="sf('region','all',document.querySelector('[data-f=region][data-v=all]'))">Reset Region</span>`);
    if(F.impact!=='all')chips.push(`<span class="preset-btn" onclick="sf('impact','all',document.querySelector('[data-f=impact][data-v=all]'))">Reset Impact</span>`);
    if(Q)chips.push(`<span class="preset-btn" onclick="Q='';document.querySelector('.search-inp').value='';render();">Clear Search</span>`);
    return `<div class="empty-msg">No stories match your current filters or search.<br><div style="margin-top:10px;">${chips.join(' ')} <span class="preset-btn" onclick="clearFilters()">✕ Clear all filters</span></div></div>`;
  }

  // What Changed Since Yesterday block
  const isFiltered=F.cat!=='all'||F.impact!=='all'||F.region!=='all'||F.trend!=='all'||Q;
  const deltaHtml=!isFiltered?`<div class="delta-block">
    <div class="delta-head">📊 What's New — ${DELTA.note}<span class="freq-badge freq-daily">🔄 Daily</span></div>
    <div class="delta-grid">
      <div class="delta-item"><div class="delta-label">New Stories</div><div class="delta-val pos">+${DELTA.newStories}</div><div class="delta-sub">Added ${DELTA.date}</div></div>
      <div class="delta-item"><div class="delta-label">High Impact</div><div class="delta-val neg">${DELTA.highImpact} critical</div><div class="delta-sub">Require action today</div></div>
      <div class="delta-item"><div class="delta-label">Total Stories</div><div class="delta-val warn">${DELTA.totalStories}</div><div class="delta-sub">Across ${Object.keys(CAT).length} categories</div></div>
    </div>
    <div class="delta-movements">${DELTA.movements.map(m=>`<div class="delta-move ${m.dir}"><strong>${m.cat}</strong> ${m.dir==='down'?'↓':'↑'} — ${m.note}</div>`).join('')}</div>
  </div>`:'';

  // Executive summary (only shown when no filter active)
  const execTake=!isFiltered?`<div class="exec-take">
    <span class="exec-take-label">CEO Summary · 30 sec</span>
    <span class="exec-take-text">A quieter week for breaking news, but the direction holds: the US and Australia keep tightening (the Aug 1 African visa-hub realignment and the Sept 15 DHS rule) while Europe gains — Ireland at a record 44,535 international students, Italy funding mass outbound mobility, and London mounting a “world HE capital” push. Nothing this week moves your hard planning dates; use the lull to firm up the Q3 forecast.</span>
  </div>`:'';

  const grps={};
  vis.forEach(n=>{if(!grps[n.date])grps[n.date]=[];grps[n.date].push(n);});
  const sortedDates=Object.keys(grps).sort((a,b)=>new Date(b)-new Date(a));
  let html=deltaHtml+execTake;
  sortedDates.forEach(date=>{
    const items=grps[date];
    html+=`<div class="tl-date">${date}</div>`;
    items.forEach((n,i)=>{
      const idx=n.id; // stable per-story id (see NEWS array) — cards/anchors key off this, never array position
      const t=TREND[n.trend];
      const isHigh=n.impact==='high';
      const isOpp=n.trend==='up';
      const newBadge=n.isNew?'<span class="new-badge">🆕 New Today</span>':'';
      const backfillBadge=(n.published&&n.published!==n.date)?`<span class="thread-badge" style="background:#fef3c7;color:#92400e;" title="Published ${n.published}, only added to this feed on ${n.date}">📌 Backfill — published ${n.published}</span>`:'';
      const oppBadge=isOpp?'<span class="opp-badge">📈 Opportunity</span>':'';
      const threadBadge=n.thread?`<span class="thread-badge">🧵 ${n.day?`Day ${n.day} · `:''}${n.thread}</span>`:'';
      const innovBadge=n.cat==='innovation'?'<span class="thread-badge" style="background:#faf5ff;color:#7e22ce;">💡 Innovation Watch</span>':'';
      const industryBlock=n.industry&&n.industry.length?`<div class="industry-block"><div class="ind-label">🔮 What this means for the industry <span class="ind-tag">· forward assessment</span></div><ul>${n.industry.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
      const impactChips=n.impacts&&n.impacts.length?`<div class="impact-chips">Company exposure: ${n.impacts.map(c=>`<span class="impact-chip" onclick="filterCompany('${c}')" title="View in Industry Trend">${c}</span>`).join('')}</div>`:'';
      html+=`<div class="story ${n.impact} ${isOpp?'opportunity':''}" id="story-${idx}" style="animation-delay:${i*.04}s">
        <div class="story-meta">
          <span class="impact-dot dot-${n.impact}"></span>
          <span class="cat-tag">${CAT[n.cat]}</span>
          <span class="region-tag">${n.region}</span>
          <span class="trend-tag ${t.cls}">${t.txt}</span>
          <span class="tier-tag" style="margin-left:auto;">${srcBadge(n.tier)} ${n.source}</span>
        </div>
        <h3>${n.title}${newBadge}${backfillBadge}${oppBadge}${threadBadge}${innovBadge}</h3>
        <p class="sum">${n.summary}</p>
        ${isHigh||isOpp
          ? `<div class="insight-block ${isOpp?'opp-insight':''}"><div class="ins-label">${isOpp?'📈 Why this is an opportunity':'💡 Why it matters'}</div><p>${n.insight}</p><span class="action ${isOpp?'opp-action-tag':''}">✓ ${n.action}</span></div>`
          : `<button class="tog-btn" id="tb${idx}" onclick="tog('${idx}')"><span class="arr">▶</span> Analysis & Action</button>
             <div class="insight-block hidden" id="ib${idx}"><div class="ins-label">💡 Why it matters</div><p>${n.insight}</p><span class="action">✓ ${n.action}</span></div>`
        }
        ${industryBlock}${impactChips}
        <div class="story-footer">
          <span class="story-src"><strong>${n.source}</strong> · ${n.published&&n.published!==n.date?`Published ${n.published} · added to feed ${n.date}`:n.date}</span>
          <a class="read-link" href="${n.url}" target="_blank">Read source →</a>
        </div>
      </div>`;
    });
  });

  return html;
}

function renderTenders(){
  const vis=TENDERS
    .filter(t=>!Q||(t.title+t.desc+t.issuer).toLowerCase().includes(Q.toLowerCase()))
    .sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  if(!vis.length)return'<div class="empty-msg">No tenders found.</div>';
  return vis.map((t,i)=>`
    <div class="tender" style="animation-delay:${i*.05}s">
      <div class="tender-meta">
        <span class="tender-type">${t.type}</span>
        <span class="tender-region">${t.region}</span>
        <span class="deadline-badge ${t.dlClass} " style="margin-left:auto;">Closes ${t.deadline}</span>
      </div>
      <h3>${t.title}</h3>
      <div class="issuer">Issuer: <strong>${t.issuer}</strong></div>
      <p class="tdesc">${t.desc}</p>
      ${t.priority?`<div class="opp-read">
        <div class="opp-read-head">🎯 Opportunity Read <span class="priority-badge pr-${t.pClass}">${t.priority} priority</span><span class="opp-assess">· editorial assessment, not a quoted figure</span></div>
        <div class="opp-row"><span class="opp-k">Best-fit pursuer</span><span class="opp-v">${t.fit}</span></div>
        <div class="opp-row"><span class="opp-k">Required capabilities</span><span class="opp-v">${t.caps}</span></div>
        <div class="opp-row"><span class="opp-k">Repeat potential</span><span class="opp-v">${t.repeat}</span></div>
        <div class="opp-why">${t.why}</div>
      </div>`:''}
      <div class="tender-footer">
        <span class="tender-val">Est. value: ${t.value}</span>
        <a class="tender-link" href="${t.url}" target="_blank">View tender →</a>
      </div>
    </div>`).join('');
}

function daysFromToday(isoDate){
  const today=new Date();today.setHours(0,0,0,0);
  const target=new Date(isoDate);target.setHours(0,0,0,0);
  return Math.round((target-today)/(1000*60*60*24));
}
// Age in days since a past ISO date — used to self-flag stale Market State / Snapshot tiles
function ageDays(isoDate){ return -daysFromToday(isoDate); }
function staleTag(isoDate){
  const a=ageDays(isoDate);
  return a>STALE_DAYS?`<div class="signal-stale" title="Not checked in ${a} days — flag for review">⚠ ${a}d old · needs check</div>`:`<div class="signal-asof">as of ${isoDate}</div>`;
}

  // ROLLING SIGNALS — derived from the live SIGNALS array (india-flagged tiles), not a static copy.
  const isig=SIGNALS.filter(s=>s.india);
  const statHtml=`<div class="india-sub">India-relevant market signals (live) · tap any to open its source story →</div><div class="india-stat">`+isig.map(x=>`<div class="is-card is-click" onclick="clickSignal('${x.cat}','${x.region}')" title="Open the source story for this number in the Daily Feed"><div class="is-label">${x.label}</div><div class="is-value ${x.cls}">${x.value}</div><div class="is-sub">${x.indiaSub||x.sub}</div></div>`).join('')+`</div>`;
  // INDIA IN THE FEED — rolling, NEW badge on stories newer than the last briefing.
  const feedHtml=`<div class="cal-section" style="margin-top:6px;"><div class="cal-section-head">📰 India in the Feed — ${stories.length} relevant stories (auto-filtered from the 7-day feed)</div></div>`+(stories.length?stories.map(s=>`<div class="ts-item" style="padding:9px 16px;border-bottom:1px solid #ede9e4;cursor:pointer;background:#fff;" onclick="jumpToStory('${s.id}')" title="Jump to full story"><span class="impact-dot dot-${s.impact}" style="margin-right:6px;"></span>${new Date(s.date)>cut?'<span class="new-pill">NEW</span>':''}<span class="ts-title" style="font-size:.8rem;">${s.title}</span><div class="ts-meta">${CAT[s.cat]||s.cat} · ${s.region} · ${s.date}</div></div>`).join(''):`<div class="empty-msg">No India-tagged stories in the current 7-day feed.</div>`);
  const intro=`<div style="padding:14px 16px 0;"><div class="why-today"><span class="why-today-label">🇮🇳 India — source-market lens</span><span class="why-today-text">India is the world's largest student-source market, so it feels every destination's tightening first. This tab rolls with the 7-day feed: what's newly moved for India, the India-relevant market signals, and every India-tagged story currently live.</span></div></div>`;
  return intro+lead+statHtml+feedHtml;
}

// ── FEATURE: Clickable signal bar → filter Intelligence Feed ──
function clickSignal(cat,region){
  setView('news',document.querySelector('[data-view="news"]'));
  if(cat){
    const catBtn=document.querySelector(`[data-f="cat"][data-v="${cat}"]`);
    if(catBtn)sf('cat',cat,catBtn);
  }
  if(region&&region!=='all'){
    // Only apply the region filter if a story actually exists matching BOTH cat and region —
    // otherwise a signal tile whose underlying story doesn't have a matching region-tagged
    // entry today would dead-end into "no stories match" even though the category itself has results.
    const wouldMatch=NEWS.some(n=>(!cat||n.cat===cat)&&n.region===region);
    if(wouldMatch){
      const regBtn=document.querySelector(`[data-f="region"][data-v="${region}"]`);
      if(regBtn)sf('region',region,regBtn);
      else{Q=region;const inp=document.querySelector('.search-inp');if(inp)inp.value=region;render();}
    }
  }
}

// ── FEATURE: Impact chip → Company Watch filtered ───────────
function filterCompany(name){
  Q=name;
  const inp=document.querySelector('.search-inp');
  if(inp)inp.value=name;
  setView('companies',document.querySelector('[data-view="companies"]'));
}

// ── Clear all filters ───────────────────────────────────────
function clearFilters(){
  const allCat=document.querySelector('[data-f="cat"][data-v="all"]');
  const allReg=document.querySelector('[data-f="region"][data-v="all"]');
  const allImp=document.querySelector('[data-f="impact"][data-v="all"]');
  const allTrend=document.querySelector('[data-f="trend"][data-v="all"]');
  if(allCat)sf('cat','all',allCat);
  if(allReg)sf('region','all',allReg);
  if(allImp)sf('impact','all',allImp);
  if(allTrend)sf('trend','all',allTrend);
  Q='';const inp=document.querySelector('.search-inp');if(inp)inp.value='';
  render();
}

// ── FEATURE: Keyboard shortcuts ─────────────────────────────
document.addEventListener('keydown',function(e){
  // Don't intercept when typing in an input
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const views=['overview','news','india','companies','tenders'];
  if(e.key==='/'){ e.preventDefault(); const inp=document.querySelector('.search-inp');if(inp)inp.focus(); }
  else if(e.key>='1'&&e.key<='5'){
    const idx=parseInt(e.key)-1;
    const btn=document.querySelector(`[data-view="${views[idx]}"]`);
    if(btn)setView(views[idx],btn);
  }
  else if(e.key==='f'||e.key==='F'){
    const catBtn=document.querySelector('[data-f="cat"][data-v="all"]');
    if(catBtn)catBtn.scrollIntoView({behavior:'smooth'});
  }
});

render();
